<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Loan Desk</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{--bg:#fff;--fg:#1f1f1f;--mut:#6b6b6b;--card:#f5f4ef;--line:#e2e0d8;--acc:#c15f3c;--ok:#2e7d32;--bad:#b3261e;--mid:#b26a00}
@media(prefers-color-scheme:dark){:root{--bg:#262624;--fg:#eee;--mut:#a3a29c;--card:#30302e;--line:#42413d;--acc:#d97757;--ok:#7fcf84;--bad:#f2766d;--mid:#e8a64a}}
[hidden]{display:none!important}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 system-ui,sans-serif}
#app{display:grid;grid-template-columns:1fr 350px;height:100vh}
main{display:flex;flex-direction:column;min-height:0;padding:0 16px}
h1{font:600 18px system-ui;margin:16px auto 0;width:100%;max-width:720px}
#log{flex:1;overflow:auto;width:100%;max-width:720px;margin:0 auto;padding:8px 0}
.msg{padding:10px 14px;margin:10px 0;border-radius:14px}.msg p{margin:6px 0}.msg ul{margin:6px 0;padding-left:20px}
.user{background:var(--card);margin-left:15%;white-space:pre-wrap}.bot{margin-right:5%}
#drop{flex:1;display:flex;align-items:center;justify-content:center;width:100%;max-width:720px;margin:12px auto;border:2px dashed var(--line);border-radius:18px;text-align:center;color:var(--mut);cursor:pointer;padding:24px}
#drop.over{border-color:var(--acc);color:var(--acc)}#drop b{display:block;font-size:20px;color:var(--fg);margin-bottom:6px}
#composer{width:100%;max-width:720px;margin:0 auto 16px;border:1px solid var(--line);border-radius:18px;background:var(--card);padding:8px}
#chips{display:flex;gap:6px;flex-wrap:wrap}#chips span{font-size:13px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:2px 8px}
#row{display:flex;gap:8px;align-items:flex-end}
textarea{flex:1;border:0;background:none;color:var(--fg);font:inherit;resize:none;outline:none;max-height:140px}
button{border:0;border-radius:10px;padding:8px 12px;font:inherit;cursor:pointer;background:var(--acc);color:#fff}
button.ghost{background:none;color:var(--mut);font-size:20px;padding:4px 8px}button:disabled{opacity:.5}
aside{border-left:1px solid var(--line);padding:16px;overflow:auto;background:var(--card)}
aside h2{font-size:15px;margin:16px 0 6px}.big{font-size:40px;font-weight:700}
.badge{display:inline-block;padding:2px 10px;border-radius:99px;font-size:13px;color:#fff}
.ok{color:var(--ok)}.no{color:var(--bad)}.small{font-size:13px;color:var(--mut)}
.ck{display:flex;justify-content:space-between;font-size:14px;padding:2px 0}aside li{font-size:14px;margin:4px 0}aside ul{padding-left:18px;margin:4px 0}
@media(max-width:800px){#app{grid-template-columns:1fr;height:auto}main{height:90vh}}
</style>
</head>
<body>
<div id="app">
<main>
<h1>Loan Desk <span class="small">decision support for lenders</span> <button id="newcase" class="ghost" style="font-size:14px">New case</button></h1>
<div id="log" hidden></div>
<div id="drop"><div><b>Drop a loan application, pay stub or bank statement here</b>images or PDF, or just type below<br>(use test or redacted documents)</div></div>
<div id="composer">
<div id="chips"></div>
<div id="row"><button class="ghost" id="attach" title="Attach">+</button>
<textarea id="q" rows="1" placeholder="Describe the applicant, the amount and term, or ask a question..."></textarea>
<button id="send">Send</button></div>
<input type="file" id="file" accept="image/*,application/pdf" multiple hidden>
</div>
</main>
<aside><div class="small">The panel updates after every message.</div><div id="panel"></div></aside>
</div>
<script>
const $ = id => document.getElementById(id);
let C = {}, M = [], imgs = [];
const el = (t, x, c) => { const e = document.createElement(t); if (x != null) e.textContent = x; if (c) e.className = c; return e; };
const pct = x => (x * 100).toFixed(1) + "%";
let CUR = "$";
const usd = x => CUR + Math.round(x).toLocaleString();

const toDataUrl = f => new Promise(res => { const i = new Image(); i.onload = () => { const s = Math.min(1, 1600 / Math.max(i.width, i.height)), c = document.createElement("canvas"); c.width = i.width * s; c.height = i.height * s; const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height); x.drawImage(i, 0, 0, c.width, c.height); res(c.toDataURL("image/jpeg", .85)); }; i.src = URL.createObjectURL(f); });
const pdfToImages = async f => {
  pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  const pdf = await pdfjsLib.getDocument({ data: await f.arrayBuffer() }).promise, out = [];
  for (let i = 1; i <= Math.min(pdf.numPages, 3); i++) {
    const p = await pdf.getPage(i), v = p.getViewport({ scale: 1600 / Math.max(...[p.getViewport({ scale: 1 }).width, p.getViewport({ scale: 1 }).height]) }), c = document.createElement("canvas");
    c.width = v.width; c.height = v.height; const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height);
    await p.render({ canvasContext: x, viewport: v }).promise; out.push(c.toDataURL("image/jpeg", .85));
  }
  return out;
};
async function addFiles(files) {
  for (const f of files) {
    const got = f.type === "application/pdf" ? await pdfToImages(f) : [await toDataUrl(f)];
    imgs.push(...got); $("chips").append(el("span", f.name));
  }
  imgs = imgs.slice(0, 3);
}
$("attach").onclick = () => $("file").click();
$("file").onchange = e => addFiles([...e.target.files]);
$("drop").onclick = () => $("file").click();
["dragover", "dragenter"].forEach(n => $("drop").addEventListener(n, e => { e.preventDefault(); $("drop").classList.add("over"); }));
["dragleave", "drop"].forEach(n => $("drop").addEventListener(n, e => { e.preventDefault(); $("drop").classList.remove("over"); }));
["dragover", "drop"].forEach(n => window.addEventListener(n, e => e.preventDefault()));
window.addEventListener("drop", e => addFiles([...e.dataTransfer.files]));

function md(box, text) {
  box.replaceChildren(); let ul = null;
  const inline = (p, s) => s.split(/\*\*(.+?)\*\*/g).forEach((t, i) => { if (t) p.append(i % 2 ? el("strong", t) : t.replace(/\*/g, "")); });
  text.split("\n").forEach(line => {
    const m = line.match(/^\s*(?:[*-]|\d+[.)])\s+(.*)/);
    if (m) { if (!ul) { ul = el("ul"); box.append(ul); } const li = el("li"); inline(li, m[1]); ul.append(li); }
    else { ul = null; if (line.trim()) { const p = el("p"); inline(p, line); box.append(p); } }
  });
}
const add = (role, text) => { $("log").hidden = false; $("drop").hidden = true; const d = el("div", text, "msg " + (role === "user" ? "user" : "bot")); $("log").append(d); $("log").scrollTop = 1e9; return d; };

function panel(d, read) {
  const p = $("panel"); p.replaceChildren(); CUR = d.currency || "$";
  const names = { need_info: ["Need more info", "var(--mut)"], meets_policy: ["Meets policy", "var(--ok)"], conditions: ["Needs conditions", "var(--mid)"], refer: ["Refer / decline", "var(--bad)"] }[d.verdict];
  const b = el("span", names[0], "badge"); b.style.background = names[1]; p.append(el("h2", "Verdict"), b);
  if (read && Object.keys(read).length) { p.append(el("h2", "Just read from your message or files")); const u = el("ul"); Object.entries(read).forEach(([k, v]) => u.append(el("li", `${({ experience_c: "credit history (1 = yes)", home_ownership_n: "housing", emp_length: "years at job", dti_pct: "DTI %", rate_pct: "rate %" })[k] || k.replace(/_/g, " ")}: ${v}`))); p.append(u); }
  const lst = (t, a) => { if (a && a.length) { p.append(el("h2", t)); const u = el("ul"); a.forEach(x => u.append(el("li", x))); p.append(u); } };
  lst("Needed for the policy checks", d.ask); lst("More details sharpen the estimate", d.ask_more);
  if (!d.request) return;
  p.append(el("h2", "Chance of default"), el("div", pct(d.request.pd), "big"),
    el("div", `Payment ${usd(d.request.payment)}/mo${d.rate_assumed ? " (rate assumed)" : ""} | data filled ${Math.round(d.completeness * 100)}%`, "small"));
  p.append(el("h2", "Policy checks"));
  d.request.checks.forEach(c => { const r = el("div", null, "ck"); const money = c.name === "Annual income", f = c.name === "FICO score";
    r.append(el("span", c.name), el("span", `${money ? usd(c.value) : f ? c.value : pct(c.value)} / ${money ? usd(c.limit) : f ? c.limit : pct(c.limit)} ${c.ok ? "OK" : "FAIL"}`, c.ok ? "ok" : "no")); p.append(r); });
  const up = d.reasons.up || [], dn = d.reasons.down || [];
  if (up.length) { p.append(el("h2", "What raises the risk")); const u = el("ul"); up.forEach(r => u.append(el("li", `${r.feature} = ${typeof r.value === "number" ? +r.value.toFixed(2) : r.value} (typical ${typeof r.typical === "number" ? +r.typical.toFixed(2) : r.typical}), +${r.effect_pts} pts`))); p.append(u); }
  if (dn.length) { p.append(el("h2", "What lowers it")); const u = el("ul"); dn.forEach(r => u.append(el("li", `${r.feature} = ${typeof r.value === "number" ? +r.value.toFixed(2) : r.value}, ${r.effect_pts} pts`))); p.append(u); }
  if (d.verdict !== "meets_policy" && d.options.length) { p.append(el("h2", "Conditions that fit policy")); const u = el("ul"); d.options.forEach(o => u.append(el("li", `${usd(o.amount)} over ${o.term} months, ${usd(o.payment)}/mo, default chance ${pct(o.pd)}`))); p.append(u); }
  if (d.request.checks.some(c => c.name === "Loan / collateral value")) p.append(el("h2", "Collateral"), el("div", `For this loan size, collateral worth at least ${usd(d.collateral_needed)} fits the loan/value limit.`, "small"));
  p.append(el("p", `Prototype model (${d.model.model}), test AUC ${d.model.auc}, Gini ${d.model.gini}, KS ${d.model.ks}. Trained on Lending Club 2007-2018. Average default rate in the training data: ${pct(d.model.train_default_rate)}. Recalibrate on your own loans before real use.`, "small"));
}

async function send() {
  const text = $("q").value.trim();
  if (!text && !imgs.length) return;
  const shown = text || "(documents attached)";
  M.push({ role: "user", content: shown }); add("user", shown + (imgs.length ? `\n[${imgs.length} file(s)]` : ""));
  const sent = imgs; imgs = []; $("chips").replaceChildren(); $("q").value = ""; $("send").disabled = true;
  const wait = add("bot", "Thinking...");
  try {
    const r = await fetch("/api/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ case: C, messages: M, images: sent }) });
    const j = await r.json(); if (!r.ok) throw new Error(j.error);
    C = j.case; M.push({ role: "assistant", content: j.reply }); md(wait, j.reply);
    if (j.debug) wait.append(el("p", "Debug: " + j.debug.images + " file(s) sent. Model reply while reading: " + (j.debug.model_reply || "(empty)"), "small")); panel(j.decision, j.read);
  } catch (e) { wait.textContent = "Error: " + e.message; M.pop(); }
  $("send").disabled = false; $("q").focus();
}
$("send").onclick = send;
$("newcase").onclick = () => { C = {}; M = []; imgs = []; $("chips").replaceChildren(); $("log").replaceChildren(); $("log").hidden = true; $("drop").hidden = false; $("panel").replaceChildren(); };
$("q").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } });
</script>
</body>
</html>
